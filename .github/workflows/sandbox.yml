# Copy into YOUR_REPO/.github/workflows/
# Pool labels must match Runner.create(labels=...); keep the unique pin.
name: Sandbox

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on:
      - self-hosted
      - modal
      - ci
      - job-${{ github.run_id }}-${{ github.job }}
    timeout-minutes: 30
    steps:
      - name: Prepare Git
        run: git config --global core.autocrlf true
      - name: Checkout Scoop
        uses: actions/checkout@v7
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Checkout Bucket
        uses: actions/checkout@v7
        with:
          path: 'my_bucket'
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
      - name: Run Excavator
        env:
          SCOOP: ${{ github.workspace }}\scoop
          SCOOP_HOME: ${{ github.workspace }}\scoop_core
          SCOOP_CACHE: ${{ github.workspace }}\scoop_cache
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'hoilc@foxmail.com'
          ssh-keygen -t rsa -b 4096 -C "Excavator" -f $HOME/.ssh/id_rsa -N ''
          ssh-keyscan github.com >> $HOME/.ssh/known_hosts
          cd ./my_bucket
          pwsh $SCOOP_HOME/bin/auto-pr.ps1 -App pumpkin-nightly -Dir ./bucket -Push -Upstream $GITHUB_REPOSITORY:$GITHUB_REF_NAME

