on:
  workflow_dispatch:
  repository_dispatch:
    types: [Excavate]
  schedule:
  - cron: '30 1,13 * * *'
name: Excavator
jobs:
  check_skip:
    name: Check recent run
    runs-on: ubuntu-latest
    env:
      # Skip window (only applies to schedule and repository_dispatch events):
      # If a successful run exists within this many seconds, the run will be skipped.
      SKIP_WINDOW_SECONDS: 5400
    outputs:
      should_skip: ${{ steps.decide.outputs.should_skip }}
    steps:
      - id: decide
        name: Decide skip
        run: |
          set -euo pipefail
          trap 'echo "::error::Unexpected failure in check_skip, falling back to should_skip=false" >&2; echo "should_skip=false" >> $GITHUB_OUTPUT; exit 0' ERR

          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"

          if [[ "$GITHUB_EVENT_NAME" != "schedule" && "$GITHUB_EVENT_NAME" != "repository_dispatch" ]]; then
            echo "Event is not schedule/repository_dispatch, skipping check (should_skip=false)"
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LIMIT=${{ env.SKIP_WINDOW_SECONDS }}
          WORKFLOW_FILE=$(echo "$GITHUB_WORKFLOW_REF" | sed -E 's|.*/workflows/([^@/]+)@.*|\1|')
          echo "Skip window: ${LIMIT}s, workflow file: $WORKFLOW_FILE"

          echo "Querying recent runs..."
          HTTP_CODE=$(curl -s -w '%{http_code}' -o /tmp/runs.json -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?per_page=20") || true
          echo "API responded with HTTP $HTTP_CODE"

          # Do not use the server-side status filter: its index can be stale.
          # Instead, find the newest successful run among the most recent runs.
          LAST_RUN=$(jq -r '[.workflow_runs[] | select(.conclusion == "success")] | first | .created_at // empty' /tmp/runs.json)
          jq -r '[.workflow_runs[] | select(.conclusion == "success")] | first | "Last successful run: #\(.run_number) \(.html_url) (\(.created_at), event: \(.event))"' /tmp/runs.json || true

          if [ -z "$LAST_RUN" ]; then
            echo "No successful run found, not skipping (should_skip=false)"
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
          NOW_EPOCH=$(date +%s)
          DIFF=$((NOW_EPOCH - LAST_EPOCH))
          echo "Last success was ${DIFF}s ago (window: ${LIMIT}s)"

          if [ $DIFF -lt $LIMIT ]; then
            echo "Within skip window (should_skip=true)"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "Outside skip window (should_skip=false)"
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  excavate:
    name: Excavate
    needs: check_skip
    if: ${{ needs.check_skip.outputs.should_skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Show rate limit for GitHub API (Before)
      shell: powershell
      run: |
        gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /rate_limit
      env:
        GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    - name: Check Manifests Without Version Variables
      id: check-manifests-without-version-vars
      shell: powershell
      run: |
        bin/checkNoVersionVariables.ps1 -StartTime $env:CHECK_START_TIME -EndTime $env:CHECK_END_TIME -Blacklist $env:CHECK_BLACKLIST -AlwaysCheck $env:CHECK_ALWAYS_MANIFESTS
      env:
        CHECK_START_TIME: '00:00'
        CHECK_END_TIME: '03:00'
        CHECK_BLACKLIST: ${{ vars.DAILY_CHECK_ALWAYS_BLACKLIST }}
        CHECK_ALWAYS_MANIFESTS: ${{ vars.DAILY_CHECK_ALWAYS_MANIFESTS }}
    - name: Excavate
      uses: ScoopInstaller/Scoop-GithubActions@main
      env:
        USER_EMAIL: hoilc@foxmail.com
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        SKIP_UPDATED: '1'
        SCOOP_GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        SCOOP_REPO: 'https://github.com/hoilc/scoop'
        SCOOP_BRANCH: 'release-v0.5.2'
        THROW_ERROR: '0'
        SPECIAL_SNOWFLAKES: ${{ steps.check-manifests-without-version-vars.outputs.manifestsWithoutVersion }}
    - name: Show rate limit for GitHub API (After)
      shell: powershell
      run: |
        gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /rate_limit
      env:
        GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
